services:
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    # No host ports — Kafka is reachable only on sentry-lite-net as redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - sentry-lite-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 5s
      timeout: 10s
      retries: 12

volumes:
  redpanda_data:

networks:
  sentry-lite-net:
    name: sentry-lite-net
