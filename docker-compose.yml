services:
  app:
    image: ghcr.io/balajimalathi/sentry-lite:latest
    build: .
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      SQLITE_PATH: /data/sentry-lite.db
      DATA_DIR: /data
      REDPANDA_BROKERS: redpanda:9092
      WEB_DIST: /app/web/dist
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      INGEST_RPS: ${INGEST_RPS:-100}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-14}
      ALERT_SMTP: ${ALERT_SMTP:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASS: ${ALERT_SMTP_PASS:-}
      ALERT_FROM: ${ALERT_FROM:-sentry-lite@localhost}
    volumes:
      - app_data:/data
    networks:
      - sentry-lite-net

volumes:
  app_data:

networks:
  sentry-lite-net:
    external: true
    name: sentry-lite-net
