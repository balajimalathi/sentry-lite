services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      SQLITE_PATH: /data/sentry-lite.db
      DATA_DIR: /data
      REDPANDA_BROKERS: redpanda:9092
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8080"
      WEB_DIST: /app/web/dist
    volumes:
      - app_data:/data
    networks:
      - sentry-lite-net

volumes:
  app_data:

networks:
  sentry-lite-net:
    external: true
    name: sentry-lite-net