services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      SQLITE_PATH: /data/sentry-lite.db
      DATA_DIR: /data
      REDPANDA_BROKERS: redpanda:9092
      WEB_DIST: /app/web/dist
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
    volumes:
      - app_data:/data
    networks:
      - sentry-lite-net

volumes:
  app_data:

networks:
  sentry-lite-net:
    external: true
    name: sentry-lite-net